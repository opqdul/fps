name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  export-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot editor
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot

      - name: Download export templates
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive templates.tpz -DestinationPath templates
          New-Item -ItemType Directory -Force "$env:APPDATA\Godot\export_templates\4.7.2.stable"
          Copy-Item "templates\templates\*" "$env:APPDATA\Godot\export_templates\4.7.2.stable" -Recurse

      - name: Export Windows build
        run: |
          & "godot\Godot_v4.7.2-stable_win64.exe" --headless --path . --export-release "Windows Desktop" build/FPS_v4.7.2.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/FPS_v4.7.2.exe
